<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

    <link rel="stylesheet" href="css/style.css" type="text/css">
  
    <title>Frontend Mentor | Product preview card component</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
  </head>
  <body>
    <article class="card">
      <picture class="image">
        <source media="(min-width: 68em)" srcset="images/image-product-desktop.jpg">
        <img class="image"src="images/image-product-mobile.jpg" alt="Image of the Product">
      </picture>
      <main class="card_text">
        <p class="product_category">Perfume</p>
        <p class="product_name">Gabrielle Essence Eau De Parfum</p>
        <p class="product_description">A floral, solar and voluptuous interpretation composed by Olivier Polge, Perfumer-Creator for the House of CHANEL.</p>
        <p class="product_sale_price">$149.99</p>
        <p class="product_price">$169.99</p>
        <a class="add_to_cart" href="#"><img src="images/icon-cart.svg" alt="cart">Add to Cart</a>
      </main>
    </article>
    <footer>
      <p class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
      Coded by <a href="https://github.com/matiasmonzonrubano1-beep">Your Name Here</a>.
      </p>
    </footer> 
  </body>
</html>
